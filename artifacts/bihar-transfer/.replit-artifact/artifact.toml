kind = "web"
previewPath = "/"
title = "Bihar Teacher Mutual Transfer"
version = "1.0.0"
id = "artifacts/bihar-transfer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19851

[services.development]
run = "pnpm --filter @workspace/bihar-transfer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bihar-transfer", "run", "build" ]
serve = "static"
publicDir = "artifacts/bihar-transfer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19851"
BASE_PATH = "/"
